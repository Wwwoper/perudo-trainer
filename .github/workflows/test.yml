name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Тесты логики (npm test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
